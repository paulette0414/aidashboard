<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Awaiting Approval — AI Generator Apps for Teachers</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="pending-screen">
  <div class="pending-card">
    <div class="pending-icon">⏳</div>
    <h1>Nakabinbin ang iyong account</h1>
    <p>
      Salamat sa pag-sign up! Kailangan munang mag-approve ng admin bago ka
      makapasok sa dashboard. Susubukan naming i-check ang status kada
      pag-refresh ng page na ito.
    </p>
    <button class="btn-primary" id="refreshBtn">I-check ulit ang status</button>
    <button class="logout-btn" id="logoutBtn" style="margin-top:10px;color:#6b7290;border-color:#e7e9f3;">Logout</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  auth.onAuthStateChanged(async (user) => {
    if (!user) { window.location.href = "index.html"; return; }
    const snap = await db.collection("users").doc(user.uid).get();
    const profile = snap.data();
    if (profile && profile.status === "approved") {
      window.location.href = "dashboard.html";
    } else if (profile && profile.status === "rejected") {
      await auth.signOut();
      window.location.href = "index.html?rejected=1";
    }
  });

  document.getElementById("refreshBtn").addEventListener("click", () => window.location.reload());
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await auth.signOut();
    window.location.href = "index.html";
  });
</script>
</body>
</html>
